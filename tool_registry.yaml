# ============================================================
# Tool Registry — prompt-engineering-system
# SSOT for all tools in the vault.
#
# HOW TO ADD A TOOL:
#   1. Append an entry under tools:
#   2. Bump meta.total_tools  (+1)
#   3. Update meta.last_validated  (YYYY-MM-DD)
#   4. git add tool_registry.yaml && git commit && git push
#   → preflight.yml validates automatically on every push.
# ============================================================

meta:
  version: "1.0.0"
  total_tools: 12
  last_validated: "2026-05-30"
  owner: GilbertKwak
  notion_sync: true          # Notion registry page is auto-updated by preflight
  schema_version: "2"

# ─────────────────────────────────────────────
# REQUIRED fields per tool:
#   id          – unique slug (kebab-case)
#   name        – human-readable display name
#   category    – PE | FIN | CON | AGENT | INFRA | DATA
#   status      – active | beta | deprecated
#   path        – relative path to the tool file / directory
#   description – one-line summary (< 120 chars)
#   added       – YYYY-MM-DD
# OPTIONAL:
#   version     – semver string
#   tags        – list of keywords
#   depends_on  – list of other tool ids this tool relies on
#   notion_page – Notion page URL for extended docs
# ─────────────────────────────────────────────

tools:

  # ── Prompt Engineering ──────────────────────────────────
  - id: crp-framework
    name: CRP Framework
    category: PE
    status: active
    path: crp_framework/
    description: Context-Role-Purpose prompt construction framework
    added: "2025-01-15"
    version: "3.0.0"
    tags: [prompt, framework, core]

  - id: master-commands
