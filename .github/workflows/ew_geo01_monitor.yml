name: EW-GEO-01 Monitor

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 실행 (UTC 기준 00:00, 06:00, 12:00, 18:00)
  workflow_dispatch:          # 수동 트리거 허용
    inputs:
      debug_mode:
        description: 'Debug mode (true/false)'
        required: false
        default: 'false'

jobs:
  geo-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install openai>=1.0.0 requests python-dotenv notion-client

      - name: Run EW-GEO-01 Monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_EW_DB_ID: ${{ secrets.NOTION_EW_DB_ID }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
        run: |
          mkdir -p output
          python scripts/ew_geo01_monitor.py

      - name: Commit report to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add output/ew_geo01_*.json || true
          git diff --staged --quiet || git commit -m "chore: EW-GEO-01 report $(date -u +%Y%m%d_%H%M)"
          git push || true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ew-geo01-report-${{ github.run_id }}
          path: output/ew_geo01_*.json
          retention-days: 30
