name: EW-GEO-01 Monitor v2.0

on:
  schedule:
    - cron: '0 */4 * * *'   # 4시간마다 (UTC 00/04/08/12/16/20)
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Debug mode (true/false)'
        required: false
        default: 'false'
      force_alert:
        description: 'Force EW alert trigger for testing (true/false)'
        required: false
        default: 'false'
      target_region:
        description: 'Target region override (ALL / TW / CN / US / JP / KR)'
        required: false
        default: 'ALL'

env:
  WORKFLOW_VERSION: '2.0.0'
  EW_TRIGGER_ID: 'EW-GEO-01'
  MONITOR_REGIONS: 'TW,CN,US,JP,KR'
  CASCADE_THRESHOLD: '0.65'   # 공급망 연쇄충격 트리거 임계값
  ALERT_SEVERITY_MIN: 'HIGH'  # 알림 발송 최소 심각도 (LOW / MEDIUM / HIGH / CRITICAL)

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: 지정학 시그널 수집 & 초기 스코어링
  # ─────────────────────────────────────────────
  geo-signal-collect:
    name: "📡 Geo Signal Collection"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      signal_score: ${{ steps.scoring.outputs.signal_score }}
      alert_level:  ${{ steps.scoring.outputs.alert_level }}
      regions_hit:  ${{ steps.scoring.outputs.regions_hit }}
      run_ts:       ${{ steps.scoring.outputs.run_ts }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            openai>=1.0.0 \
            anthropic>=0.25.0 \
            requests>=2.31.0 \
            python-dotenv \
            notion-client>=2.2.1 \
            pydantic>=2.0 \
            tenacity>=8.2 \
            rich>=13.0

      - name: Run EW-GEO-01 Signal Collector
        id: collect
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          NOTION_TOKEN:      ${{ secrets.NOTION_TOKEN }}
          NOTION_EW_DB_ID:   ${{ secrets.NOTION_EW_DB_ID }}
          NOTION_KG_DB_ID:   ${{ secrets.NOTION_KG_DB_ID }}
          TARGET_REGION:     ${{ github.event.inputs.target_region || 'ALL' }}
          DEBUG_MODE:        ${{ github.event.inputs.debug_mode || 'false' }}
          FORCE_ALERT:       ${{ github.event.inputs.force_alert || 'false' }}
          WORKFLOW_VERSION:  ${{ env.WORKFLOW_VERSION }}
          EW_TRIGGER_ID:     ${{ env.EW_TRIGGER_ID }}
        run: |
          mkdir -p output/geo01
          python scripts/ew_geo01_monitor.py \
            --mode collect \
            --output output/geo01/signals_$(date -u +%Y%m%d_%H%M).json

      - name: Score & Threshold Evaluation
        id: scoring
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CASCADE_THRESHOLD: ${{ env.CASCADE_THRESHOLD }}
          ALERT_SEVERITY_MIN: ${{ env.ALERT_SEVERITY_MIN }}
        run: |
          python scripts/ew_geo01_monitor.py \
            --mode score \
            --input  output/geo01/signals_*.json \
            --output output/geo01/score_$(date -u +%Y%m%d_%H%M).json \
            --set-output

      - name: Upload signals artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo01-signals-${{ github.run_id }}
          path: output/geo01/signals_*.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # JOB 2: 공급망 연쇄충격 시뮬레이션 (스코어 임계값 초과 시)
  # ─────────────────────────────────────────────
  cascade-simulation:
    name: "⛓️ Supply Chain Cascade Sim"
    needs: geo-signal-collect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      needs.geo-signal-collect.outputs.alert_level == 'HIGH' ||
      needs.geo-signal-collect.outputs.alert_level == 'CRITICAL' ||
      github.event.inputs.force_alert == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            openai>=1.0.0 \
            anthropic>=0.25.0 \
            requests>=2.31.0 \
            python-dotenv \
            notion-client>=2.2.1 \
            pydantic>=2.0 \
            tenacity>=8.2

      - name: Download signals artifact
        uses: actions/download-artifact@v4
        with:
          name: geo01-signals-${{ github.run_id }}
          path: output/geo01/

      - name: Run Cascade Simulation (TW→JP→KR→US)
        id: cascade
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN:      ${{ secrets.NOTION_TOKEN }}
          NOTION_EW_DB_ID:   ${{ secrets.NOTION_EW_DB_ID }}
          SIGNAL_SCORE:      ${{ needs.geo-signal-collect.outputs.signal_score }}
          REGIONS_HIT:       ${{ needs.geo-signal-collect.outputs.regions_hit }}
          CASCADE_THRESHOLD: ${{ env.CASCADE_THRESHOLD }}
        run: |
          mkdir -p output/geo01
          python scripts/ew_geo01_monitor.py \
            --mode cascade \
            --signal-score "$SIGNAL_SCORE" \
            --regions "$REGIONS_HIT" \
            --input  output/geo01/signals_*.json \
            --output output/geo01/cascade_$(date -u +%Y%m%d_%H%M).json

      - name: Upload cascade report
        uses: actions/upload-artifact@v4
        with:
          name: geo01-cascade-${{ github.run_id }}
          path: output/geo01/cascade_*.json
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 3: Notion EW DB 싱크 & 레포트 커밋
  # ─────────────────────────────────────────────
  notion-sync-and-commit:
    name: "📝 Notion Sync & Commit"
    needs: [geo-signal-collect, cascade-simulation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && needs.geo-signal-collect.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            openai>=1.0.0 \
            requests>=2.31.0 \
            python-dotenv \
            notion-client>=2.2.1 \
            pydantic>=2.0 \
            tenacity>=8.2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: geo01-*-${{ github.run_id }}
          path: output/geo01/
          merge-multiple: true

      - name: Sync to Notion EW Database
        id: notion-sync
        env:
          NOTION_TOKEN:      ${{ secrets.NOTION_TOKEN }}
          NOTION_EW_DB_ID:   ${{ secrets.NOTION_EW_DB_ID }}
          NOTION_KG_DB_ID:   ${{ secrets.NOTION_KG_DB_ID }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ALERT_LEVEL:       ${{ needs.geo-signal-collect.outputs.alert_level }}
          SIGNAL_SCORE:      ${{ needs.geo-signal-collect.outputs.signal_score }}
          REGIONS_HIT:       ${{ needs.geo-signal-collect.outputs.regions_hit }}
          RUN_TS:            ${{ needs.geo-signal-collect.outputs.run_ts }}
          CASCADE_RAN:       ${{ needs.cascade-simulation.result }}
          EW_TRIGGER_ID:     ${{ env.EW_TRIGGER_ID }}
          WORKFLOW_VERSION:  ${{ env.WORKFLOW_VERSION }}
        run: |
          python scripts/ew_geo01_monitor.py \
            --mode notion-sync \
            --input  output/geo01/ \
            --alert-level "$ALERT_LEVEL" \
            --signal-score "$SIGNAL_SCORE"

      - name: Generate EW Summary Report (Markdown)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALERT_LEVEL:    ${{ needs.geo-signal-collect.outputs.alert_level }}
          SIGNAL_SCORE:   ${{ needs.geo-signal-collect.outputs.signal_score }}
          REGIONS_HIT:    ${{ needs.geo-signal-collect.outputs.regions_hit }}
          RUN_TS:         ${{ needs.geo-signal-collect.outputs.run_ts }}
        run: |
          python scripts/ew_geo01_monitor.py \
            --mode report \
            --input  output/geo01/ \
            --output output/geo01/EW_GEO01_$(date -u +%Y%m%d_%H%M).md

      - name: Commit reports to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions [EW-GEO-01]"
          git add output/geo01/ || true
          git diff --staged --quiet || \
            git commit -m "chore(ew-geo01): report $(date -u +%Y%m%d_%H%M) | score=${{ needs.geo-signal-collect.outputs.signal_score }} | level=${{ needs.geo-signal-collect.outputs.alert_level }}"
          git push || true

      - name: Upload final report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo01-final-report-${{ github.run_id }}
          path: |
            output/geo01/*.json
            output/geo01/*.md
          retention-days: 90

  # ─────────────────────────────────────────────
  # JOB 4: Emergency Alert (CRITICAL 레벨 전용)
  # ─────────────────────────────────────────────
  emergency-alert:
    name: "🚨 Emergency Alert Dispatch"
    needs: [geo-signal-collect, cascade-simulation, notion-sync-and-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      needs.geo-signal-collect.outputs.alert_level == 'CRITICAL' ||
      github.event.inputs.force_alert == 'true'
    permissions:
      contents: read
      actions: write

    steps:
      - name: Trigger EW Emergency Pipeline
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'ai-intel-ew-emergency.yml',
              ref: 'main',
              inputs: {
                trigger_id:    'EW-GEO-01',
                alert_level:   '${{ needs.geo-signal-collect.outputs.alert_level }}',
                signal_score:  '${{ needs.geo-signal-collect.outputs.signal_score }}',
                regions_hit:   '${{ needs.geo-signal-collect.outputs.regions_hit }}',
                source_run_id: '${{ github.run_id }}'
              }
            });
            console.log('✅ Emergency pipeline triggered for EW-GEO-01 CRITICAL');

      - name: Log emergency dispatch
        run: |
          echo "🚨 CRITICAL alert dispatched at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "   Trigger : EW-GEO-01"
          echo "   Score   : ${{ needs.geo-signal-collect.outputs.signal_score }}"
          echo "   Regions : ${{ needs.geo-signal-collect.outputs.regions_hit }}"
          echo "   Run ID  : ${{ github.run_id }}"
