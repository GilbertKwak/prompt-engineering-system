# =============================================================
# GitHub Actions → Notion PE 허브 자동 Push 파이프라인
# 트리거: scripts/ 디렉토리 변경 또는 수동 실행
# 대상: PE-FIN / PE-CON / PE-IP 3-Engine 실행 결과
# =============================================================
name: Notion PE Hub Sync

on:
  push:
    paths:
      - 'scripts/**'
      - 'PE-FIN/**'
      - 'PE-CON/**'
      - 'PE-IP/**'
      - 'engines/**'
      - 'output/**'
  workflow_dispatch:
    inputs:
      engine:
        description: '실행할 Engine (FIN / CON / IP / ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - FIN
          - CON
          - IP
      dry_run:
        description: 'Dry-run (Notion에 실제로 Push하지 않음)'
        required: false
        default: false
        type: boolean

jobs:
  pe-notion-sync:
    name: PE Scripts → Notion Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. 체크아웃 ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # diff 감지를 위해 2개 커밋 필요

      # ── 2. Python 환경 ────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. 의존성 설치 ────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install notion-client numpy-financial requests python-dateutil
          # requirements.txt가 있으면 추가 설치
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      # ── 4. PE 스크립트 실행 ───────────────────────────────────
      - name: Run PE scripts (Engine selection)
        id: run_scripts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PE_HUB_DB_ID: ${{ secrets.NOTION_PE_HUB_DB_ID }}
          ENGINE_TARGET: ${{ github.event.inputs.engine || 'ALL' }}
        run: |
          echo "ENGINE_TARGET=$ENGINE_TARGET" >> $GITHUB_ENV

          # financial_bridge_v1.py 실행 (PE-FIN Engine)
          if [[ "$ENGINE_TARGET" == "ALL" || "$ENGINE_TARGET" == "FIN" ]]; then
            echo "::group::PE-FIN Engine"
            python scripts/financial_bridge_v1.py \
              --capex 2500 \
              --opex 380 \
              --target_yield 0.78 \
              --output_json output/fin_result.json || true
            echo "::endgroup::"
          fi

          # CON / IP 엔진 스크립트가 있으면 실행
          if [[ "$ENGINE_TARGET" == "ALL" || "$ENGINE_TARGET" == "CON" ]]; then
            echo "::group::PE-CON Engine"
            [ -f scripts/con_bridge.py ] && python scripts/con_bridge.py \
              --output_json output/con_result.json || true
            echo "::endgroup::"
          fi

          if [[ "$ENGINE_TARGET" == "ALL" || "$ENGINE_TARGET" == "IP" ]]; then
            echo "::group::PE-IP Engine"
            [ -f scripts/ip_bridge.py ] && python scripts/ip_bridge.py \
              --output_json output/ip_result.json || true
            echo "::endgroup::"
          fi

      # ── 5. Notion Push ────────────────────────────────────────
      - name: Push results to Notion PE Hub
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PE_HUB_DB_ID: ${{ secrets.NOTION_PE_HUB_DB_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          ENGINE_TARGET: ${{ env.ENGINE_TARGET }}
        run: |
          python scripts/notion_pe_hub_push.py \
            --engine "$ENGINE_TARGET" \
            --commit "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME"

      # ── 6. Dry-run 확인 메시지 ───────────────────────────────
      - name: Dry-run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "[DRY-RUN] Notion Push 생략됨"
          echo "결과 파일 목록:"
          ls -lh output/*.json 2>/dev/null || echo "output/ 없음"

      # ── 7. 실행 결과 아티팩트 저장 ───────────────────────────
      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pe-engine-output-${{ github.run_number }}
          path: output/
          retention-days: 30
