# ============================================================
# notion-sync.yml
# prompt-engineering-system ↔ Notion PE 허브 자동 동기화
# 트리거: push to main (engines/**, scripts/**, PE-*/**)
#         schedule: 매일 09:00 KST (00:00 UTC)
#         workflow_dispatch: 수동 실행
# ============================================================
name: Notion PE Hub Sync

on:
  push:
    branches: [main]
    paths:
      - 'engines/**'
      - 'scripts/**'
      - 'PE-CON/**'
      - 'PE-FIN/**'
      - 'PE-IP/**'
      - 'automation/**'
      - 'reports/**'
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:
    inputs:
      engine:
        description: '동기화 대상 엔진 (all | PE-CON | PE-FIN | PE-IP)'
        required: false
        default: 'all'
      dry_run:
        description: '드라이런 모드 (Notion 실제 쓰기 없이 검증만)'
        type: boolean
        default: false

env:
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_PE_HUB_DB_ID: ${{ secrets.NOTION_PE_HUB_DB_ID }}
  NOTION_SCRIPTS_DB_ID: ${{ secrets.NOTION_SCRIPTS_DB_ID }}
  NOTION_REPORTS_DB_ID: ${{ secrets.NOTION_REPORTS_DB_ID }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: 변경 파일 감지 & 분류
  # ─────────────────────────────────────────
  detect-changes:
    name: Detect & Classify Changes
    runs-on: ubuntu-latest
    outputs:
      has_engine_changes: ${{ steps.classify.outputs.has_engine_changes }}
      has_script_changes: ${{ steps.classify.outputs.has_script_changes }}
      has_report_changes: ${{ steps.classify.outputs.has_report_changes }}
      changed_engines: ${{ steps.classify.outputs.changed_engines }}
      target_engine: ${{ steps.classify.outputs.target_engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        run: |
          # 수동 실행 시 입력값 우선
          TARGET="${{ github.event.inputs.engine || 'all' }}"
          echo "target_engine=$TARGET" >> $GITHUB_OUTPUT

          # 변경 파일 목록
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo '')
          echo "Changed files:"
          echo "$CHANGED"

          # 엔진 변경 감지
          ENGINE_CHANGED=$(echo "$CHANGED" | grep -E '^engines/' | head -20 || true)
          if [ -n "$ENGINE_CHANGED" ]; then
            echo "has_engine_changes=true" >> $GITHUB_OUTPUT
            # 변경된 엔진 목록 JSON 배열
            ENGINES=$(echo "$ENGINE_CHANGED" | awk -F'/' '{print $2}' | sort -u | jq -R . | jq -sc .)
            echo "changed_engines=$ENGINES" >> $GITHUB_OUTPUT
          else
            echo "has_engine_changes=false" >> $GITHUB_OUTPUT
            echo 'changed_engines=[]' >> $GITHUB_OUTPUT
          fi

          # 스크립트 변경 감지
          SCRIPT_CHANGED=$(echo "$CHANGED" | grep -E '^scripts/' || true)
          [ -n "$SCRIPT_CHANGED" ] && echo "has_script_changes=true" >> $GITHUB_OUTPUT || echo "has_script_changes=false" >> $GITHUB_OUTPUT

          # 리포트 변경 감지
          REPORT_CHANGED=$(echo "$CHANGED" | grep -E '^(reports/|PE-FIN/|PE-CON/|PE-IP/)' || true)
          [ -n "$REPORT_CHANGED" ] && echo "has_report_changes=true" >> $GITHUB_OUTPUT || echo "has_report_changes=false" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────
  # JOB 2: Python 의존성 캐시 설치
  # ─────────────────────────────────────────
  setup:
    name: Setup Python Environment
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install notion-client==2.3.0 requests==2.32.3 PyYAML==6.0.2 python-dotenv==1.0.1
          # 기존 requirements.txt가 있으면 추가 설치
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-notion-${{ hashFiles('requirements.txt') }}

  # ─────────────────────────────────────────
  # JOB 3: 3-Engine 구조 → Notion PE 허브 DB Push
  # ─────────────────────────────────────────
  sync-engines:
    name: Sync 3-Engine Structure → Notion PE Hub
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: >
      needs.detect-changes.outputs.has_engine_changes == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install notion-client==2.3.0 requests==2.32.3 PyYAML==6.0.2 python-dotenv==1.0.1

      - name: Run engine sync
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TARGET_ENGINE: ${{ needs.detect-changes.outputs.target_engine }}
        run: |
          python .github/scripts/sync_engines_to_notion.py \
            --engine "$TARGET_ENGINE" \
            --dry-run "$DRY_RUN"

  # ─────────────────────────────────────────
  # JOB 4: scripts/ 실행 결과 → Notion Scripts DB Push
  # ─────────────────────────────────────────
  sync-scripts:
    name: Sync scripts/ Metadata → Notion Scripts DB
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: >
      needs.detect-changes.outputs.has_script_changes == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install notion-client==2.3.0 requests==2.32.3 PyYAML==6.0.2 python-dotenv==1.0.1

      - name: Run scripts sync
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python .github/scripts/sync_scripts_to_notion.py \
            --dry-run "$DRY_RUN"

  # ─────────────────────────────────────────
  # JOB 5: reports/ & PE-* → Notion Reports DB Push
  # ─────────────────────────────────────────
  sync-reports:
    name: Sync Reports → Notion Reports DB
    runs-on: ubuntu-latest
    needs: [detect-changes, setup]
    if: >
      needs.detect-changes.outputs.has_report_changes == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install notion-client==2.3.0 requests==2.32.3 PyYAML==6.0.2 python-dotenv==1.0.1

      - name: Run reports sync
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python .github/scripts/sync_reports_to_notion.py \
            --dry-run "$DRY_RUN"

  # ─────────────────────────────────────────
  # JOB 6: 동기화 결과 요약 → 슬랙/Notion 알림
  # ─────────────────────────────────────────
  notify:
    name: Notify Sync Result
    runs-on: ubuntu-latest
    needs: [sync-engines, sync-scripts, sync-reports]
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "## 🔄 Notion Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| sync-engines | ${{ needs.sync-engines.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| sync-scripts | ${{ needs.sync-scripts.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| sync-reports | ${{ needs.sync-reports.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
