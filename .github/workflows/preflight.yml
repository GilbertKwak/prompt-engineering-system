# ============================================================
# preflight.yml — Tool Registry Preflight Validator
# Triggers: push to main (tool_registry.yaml 변경 시)
#           PR to main
#           수동 dispatch
# ============================================================
name: 🛡️ Preflight Validator

on:
  push:
    branches: [main]
    paths:
      - 'tool_registry.yaml'
      - 'preflight_validator.py'
  pull_request:
    branches: [main]
    paths:
      - 'tool_registry.yaml'
  workflow_dispatch:
    inputs:
      notify_notion:
        description: 'Sync result to Notion after validation'
        required: false
        default: 'true'
        type: boolean

jobs:
  validate:
    name: Validate Tool Registry
    runs-on: ubuntu-latest
    outputs:
      total_tools: ${{ steps.validate.outputs.total_tools }}
      valid_tools: ${{ steps.validate.outputs.valid_tools }}
      error_count: ${{ steps.validate.outputs.error_count }}
      last_validated: ${{ steps.validate.outputs.last_validated }}
      status: ${{ steps.validate.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml requests python-dateutil

      - name: Run preflight validator
        id: validate
        run: |
          python preflight_validator.py --output-github-actions
        env:
          REGISTRY_PATH: tool_registry.yaml

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report-${{ github.run_id }}
          path: preflight_report.json
          retention-days: 30

      - name: Comment on PR (if validation failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = {};
            try { report = JSON.parse(fs.readFileSync('preflight_report.json', 'utf8')); } catch(e) {}
            const body = [
              '## ❌ Preflight Validation Failed',
              '',
              `**Errors:** ${report.error_count ?? 'unknown'}`,
              `**Total tools declared:** ${report.meta?.total_tools ?? '?'}`,
              `**Actual tools found:** ${report.actual_count ?? '?'}`,
              '',
              '### Issues',
              ...(report.errors ?? ['No detail available']).map(e => `- ${e}`),
              '',
              '> Fix `tool_registry.yaml` and update `meta.total_tools` + `meta.last_validated` before merging.'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  notify-notion:
    name: Sync to Notion Registry Page
    runs-on: ubuntu-latest
    needs: validate
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.notify_notion == 'true'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Sync registry status to Notion
        run: python scripts/notion_registry_sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REGISTRY_PAGE_ID: ${{ secrets.NOTION_REGISTRY_PAGE_ID }}
          VALIDATION_STATUS: ${{ needs.validate.outputs.status }}
          TOTAL_TOOLS: ${{ needs.validate.outputs.total_tools }}
          VALID_TOOLS: ${{ needs.validate.outputs.valid_tools }}
          ERROR_COUNT: ${{ needs.validate.outputs.error_count }}
          LAST_VALIDATED: ${{ needs.validate.outputs.last_validated }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
