# ============================================================
# tool_registry.yaml
# Prompt Engineering System — Tool Registry
# ============================================================
# 운영 지침:
#   1. 새 도구 추가 → tools 섹션에 항목 추가
#   2. meta.total_tools 카운트 갱신
#   3. meta.last_validated 날짜 갱신 (YYYY-MM-DD)
#   4. git push → preflight.yml이 자동으로 검증
#   5. Notion 레지스트리 페이지는 워크플로 완료 후 자동 동기화
# ============================================================

meta:
  version: "2.0.0"
  total_tools: 18
  last_validated: "2026-05-30"
  maintainer: "GilbertKwak"
  repository: "https://github.com/GilbertKwak/prompt-engineering-system"
  notion_registry_page: "tool-registry-status"   # Notion page slug/ID (secrets에서 관리)
  description: >
    Prompt Engineering System의 모든 도구, 에이전트, 통합 컴포넌트를
    단일 소스로 관리하는 레지스트리. preflight 검증 자동화로 일관성 보장.

